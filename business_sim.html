<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경영 시뮬레이션 — CEO의 15년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#1a2332; --panel:#0f1923; --panel2:#162336;
    --card:#1e2d40; --card2:#1e3048; --inset:#132030;
    --border:#2d4a6e; --border2:#2a3f58;
    --text:#e8edf3; --muted:#5a7a9a; --muted2:#7a9fc2;
    --accent:#a8c8e8; --accent2:#d0e8ff;
    --green:#4ec97a; --green-bg:#142a1e;
    --red:#ff6b6b; --red-bg:#2a1414;
    --gold:#f0c060; --cyan:#4ec9c9;
    --grad:linear-gradient(90deg,#2d6a9f,#4ec97a);
  }
  * { box-sizing:border-box; margin:0; padding:0; }

  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }

  /* ── Top progress bar ── */
  #progressBar { position:sticky; top:0; z-index:120; height:4px; background:#0a121c; }
  #progressFill { height:100%; width:0%; background:var(--grad); transition:width .5s ease; }

  /* ── Dashboard ── */
  #dashboard {
    position:sticky; top:4px; z-index:100;
    background:var(--panel); border-bottom:2px solid var(--border);
    padding:10px 12px 8px; box-shadow:0 2px 12px rgba(0,0,0,.5);
  }
  #dash-head {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:8px;
  }
  #dash-title { font-size:14px; font-weight:800; color:var(--accent2); }
  #dash-right { display:flex; align-items:center; gap:8px; }
  #dash-year { font-size:12px; font-weight:700; color:var(--gold); }
  #reset-btn {
    font-size:11px; font-weight:700; font-family:inherit; cursor:pointer;
    color:var(--muted2); background:transparent; border:1px solid var(--border);
    border-radius:8px; padding:3px 9px; transition:all .15s;
  }
  #reset-btn:active { background:var(--card2); color:var(--text); }

  .metric-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
  .metric-card {
    background:var(--card2); border:1px solid var(--border);
    border-radius:10px; padding:7px 3px 8px; text-align:center;
  }
  .metric-card .m-name { font-size:10px; font-weight:700; color:var(--accent); margin-bottom:2px; }
  .metric-card .m-val { font-size:15px; font-weight:800; transition:color .3s; }
  .metric-card .m-delta { font-size:10px; font-weight:700; height:12px; }
  .m-delta.plus { color:var(--green); }
  .m-delta.minus { color:var(--red); }
  .stat-bar { height:5px; border-radius:4px; background:#0c1622; margin-top:4px; overflow:hidden; }
  .stat-fill { height:100%; border-radius:4px; transition:width .4s ease, background .4s; }
  .lv-hi { background:var(--green); } .lv-mid { background:var(--gold); } .lv-lo { background:var(--red); }

  /* ── 7 functional sub-scores strip ── */
  #sub-strip {
    display:grid; grid-template-columns:repeat(7,1fr); gap:4px;
    margin-top:8px; padding-top:8px; border-top:1px solid var(--border2);
  }
  .sub-cell { text-align:center; }
  .sub-cell .s-name { font-size:9px; color:var(--muted2); font-weight:600; margin-bottom:2px; line-height:1.1; }
  .sub-cell .s-val { font-size:11px; font-weight:700; color:var(--text); }
  .sub-bar { height:3px; border-radius:3px; background:#0c1622; margin-top:2px; overflow:hidden; }

  /* ── Main ── */
  main { padding:12px; max-width:600px; margin:0 auto; }

  .section-title {
    font-size:11px; color:var(--muted); letter-spacing:1px;
    text-transform:uppercase; font-weight:700; margin:4px 2px 8px;
  }

  /* ── Scenario card ── */
  .scenario-card {
    background:var(--card); border:1px solid var(--border2);
    border-radius:14px; overflow:hidden; margin-bottom:12px;
  }
  .scn-header { padding:12px 14px 10px; background:var(--panel2); }
  .scn-badges { display:flex; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .scn-year { font-size:11px; font-weight:700; color:var(--gold); }
  .cat-badge {
    font-size:10px; padding:2px 8px; border-radius:20px; font-weight:700;
  }
  .cat-opportunity { background:#1a3a4a; color:var(--cyan); border:1px solid var(--cyan); }
  .cat-crisis { background:var(--red-bg); color:var(--red); border:1px solid var(--red); }
  .cat-growth { background:var(--green-bg); color:var(--green); border:1px solid var(--green); }
  .cat-market { background:#2a2440; color:#c9a0ff; border:1px solid #c9a0ff; }
  .cat-org { background:#3a2e14; color:var(--gold); border:1px solid var(--gold); }
  .scn-title { font-size:17px; font-weight:800; color:var(--accent2); margin-bottom:6px; }
  .scn-desc { font-size:13.5px; line-height:1.6; color:#cdddee; }

  /* ── Decision blocks ── */
  .scn-body { padding:12px 14px 14px; }
  .decision {
    background:var(--inset); border:1px solid var(--border2);
    border-radius:10px; padding:10px 11px; margin-bottom:10px;
  }
  .dec-head { display:flex; align-items:center; gap:7px; margin-bottom:8px; }
  .dom-badge {
    font-size:11px; font-weight:800; padding:2px 9px; border-radius:20px;
    border:1px solid; white-space:nowrap;
  }
  .dec-q { font-size:13px; font-weight:600; color:var(--accent); }
  .options { display:flex; flex-direction:column; gap:6px; }
  .opt-btn {
    text-align:left; width:100%; background:var(--card2);
    border:1.5px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 11px; font-size:13px; line-height:1.4;
    cursor:pointer; transition:all .15s; font-family:inherit;
  }
  .opt-btn:active { transform:scale(.99); }
  .opt-btn.selected {
    border-color:var(--green); background:#16322a; color:#dffaeb;
    box-shadow:0 0 0 1px var(--green) inset;
  }

  /* ── Settle button ── */
  .settle-btn {
    width:100%; padding:14px; border:none; border-radius:12px;
    font-size:16px; font-weight:800; font-family:inherit; cursor:pointer;
    background:var(--grad); color:#06140c; transition:opacity .2s;
    margin-top:4px;
  }
  .settle-btn:disabled { background:#243548; color:#5a7a9a; cursor:not-allowed; }
  .settle-hint { font-size:11px; color:var(--muted); text-align:center; margin-top:8px; }

  /* ── Result panel ── */
  .result-panel {
    background:var(--card); border:1px solid var(--border2);
    border-radius:14px; padding:14px; margin-bottom:12px;
  }
  .result-panel h3 { font-size:16px; color:var(--accent2); margin-bottom:10px; }
  .syn-msg {
    font-size:13px; line-height:1.55; padding:9px 11px; border-radius:9px;
    margin-bottom:7px; border-left:3px solid;
  }
  .syn-msg.synergy { background:var(--green-bg); border-color:var(--green); color:#cdf3d9; }
  .syn-msg.conflict { background:var(--red-bg); border-color:var(--red); color:#ffd3d3; }
  .syn-msg.neutral { background:var(--inset); border-color:var(--muted); color:#c5d6e6; }
  .syn-tag { font-weight:800; margin-right:5px; }

  .delta-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin:12px 0 6px; }
  .delta-cell {
    background:var(--inset); border:1px solid var(--border2);
    border-radius:9px; padding:7px 4px; text-align:center;
  }
  .delta-cell .d-name { font-size:10px; color:var(--muted2); margin-bottom:3px; }
  .delta-cell .d-val { font-size:14px; font-weight:800; }
  .d-val.plus { color:var(--green); } .d-val.minus { color:var(--red); } .d-val.zero { color:var(--muted); }
  .sub-delta-line { font-size:11px; color:var(--muted2); text-align:center; margin-top:6px; line-height:1.7; }
  .sub-delta-line .up { color:var(--green); font-weight:700; }
  .sub-delta-line .down { color:var(--red); font-weight:700; }

  /* ── Ending ── */
  #endingScreen { text-align:center; padding:8px 4px 24px; }
  .ending-emoji { font-size:54px; margin:12px 0 4px; }
  .ending-title { font-size:24px; font-weight:800; margin-bottom:6px; line-height:1.3; }
  .ending-title.good { color:var(--green); } .ending-title.neutral { color:var(--gold); } .ending-title.bad { color:var(--red); }
  .ending-sub { font-size:12px; color:var(--muted2); margin-bottom:14px; }
  .ending-text { font-size:14px; line-height:1.7; color:#cdddee; text-align:left;
    background:var(--card); border:1px solid var(--border2); border-radius:12px; padding:14px; margin-bottom:14px; }
  .timeline {
    text-align:left; background:var(--inset); border:1px solid var(--border2);
    border-radius:12px; padding:12px 14px; margin-bottom:14px;
  }
  .timeline h4 { font-size:13px; color:var(--accent); margin-bottom:8px; }
  .tl-item { font-size:12px; color:#bcd0e2; line-height:1.6; padding:3px 0; border-bottom:1px dashed #233650; }
  .tl-item:last-child { border-bottom:none; }
  .tl-year { color:var(--gold); font-weight:700; margin-right:6px; }
  .final-stats { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:14px; }

  /* ── Start screen ── */
  #startScreen { text-align:center; padding:18px 6px 24px; }
  #startScreen .start-emoji { font-size:60px; margin:18px 0 6px; }
  #startScreen h1 { font-size:26px; font-weight:800; color:var(--accent2); margin-bottom:4px; }
  #startScreen .start-tag { font-size:13px; color:var(--gold); font-weight:700; margin-bottom:16px; }
  #startScreen .start-intro {
    font-size:13.5px; line-height:1.7; color:#cdddee; text-align:left;
    background:var(--card); border:1px solid var(--border2); border-radius:12px;
    padding:14px; margin-bottom:18px;
  }
  #startScreen .start-intro b { color:var(--accent); }
  #startScreen .name-label { font-size:12px; color:var(--muted2); font-weight:700; text-align:left; display:block; margin:0 2px 6px; }
  #companyInput {
    width:100%; font-family:inherit; font-size:18px; font-weight:700;
    color:var(--text); background:var(--inset); border:1.5px solid var(--border);
    border-radius:10px; padding:13px 14px; text-align:center; margin-bottom:16px;
  }
  #companyInput:focus { outline:none; border-color:var(--green); }

  button.primary {
    width:100%; padding:13px; border:none; border-radius:12px;
    font-size:15px; font-weight:800; font-family:inherit; cursor:pointer;
    background:var(--grad); color:#06140c;
  }
  button.ghost {
    width:100%; padding:11px; border:1px solid var(--border); border-radius:10px;
    font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;
    background:transparent; color:var(--muted2); margin-top:8px;
  }
  .footer-note { font-size:10px; color:#3d556e; text-align:center; padding:16px 0 8px; }
</style>
</head>
<body>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="dashboard"></div>
  <main>
    <div id="startScreen" style="display:none;"></div>
    <div id="scenarioArea"></div>
    <div id="endingScreen" style="display:none;"></div>
    <div class="footer-note">경영 시뮬레이션 · 7개 기능 의사결정의 조합이 회사의 운명을 바꿉니다</div>
  </main>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  COMPANY: '(주)한빛',
  MAX_YEAR: 15,
  SAVE_KEY: 'businessSim',
  SAVE_VER: 3,
  START_STATS: { cash:100, revenue:50, profit:50, morale:60, reputation:50 },
  START_SUB:   { strategy:50, hr:50, finance:50, accounting:55, marketing:50, ops:50, mis:45 },
};

/* 5대 핵심 지표 메타 */
const METRICS = [
  { key:'cash',       name:'자금',   unit:'억', isCash:true },
  { key:'revenue',    name:'매출력', unit:'',   isCash:false },
  { key:'profit',     name:'수익성', unit:'',   isCash:false },
  { key:'morale',     name:'조직력', unit:'',   isCash:false },
  { key:'reputation', name:'평판',   unit:'',   isCash:false },
];

/* 7개 기능 영역 메타 */
const DOMAINS = {
  strategy:   { label:'전략',     short:'전략', color:'#4ec9c9' },
  hr:         { label:'인사',     short:'인사', color:'#4ec97a' },
  finance:    { label:'재무',     short:'재무', color:'#f0c060' },
  accounting: { label:'회계',     short:'회계', color:'#c9a0ff' },
  marketing:  { label:'마케팅',   short:'마케팅', color:'#ff8fb0' },
  ops:        { label:'생산/서비스', short:'생산', color:'#6fa8ff' },
  mis:        { label:'MIS',      short:'MIS',  color:'#5ad1e8' },
};
const SUB_NAMES = {
  strategy:'전략지수', hr:'인사역량', finance:'재무건전', accounting:'회계투명',
  marketing:'마케팅력', ops:'생산품질', mis:'MIS성숙',
};

/* =========================================================
   DATA: SCENARIOS
   - year: 고정 마일스톤 / null: 풀(yearMin~yearMax)
   - decisions[].options[]: { text, base{4지표}, sub{7기능}, tags[], setFlags{} }
   ========================================================= */
const SCENARIOS = [
  /* ── 마일스톤: 1년차 창업 ── */
  {
    id:'y1_founding', year:1, weight:100, category:'opportunity', title:'창업: 첫 사업의 방향',
    env:{ tags:['startup'] },
    description:'드디어 회사를 설립했습니다. 자본은 넉넉하지 않지만 시장의 기회는 열려 있습니다. 창업 첫 해, 회사의 토대를 어떻게 다질지 결정해야 합니다.',
    decisions:[
      { domain:'strategy', question:'주력 사업 방향을 정하세요.', options:[
        { text:'안정적인 B2B 수주 사업으로 시작한다', base:{cash:15,revenue:10}, sub:{strategy:5,finance:5}, tags:['b2b','conservative'] },
        { text:'대중을 겨냥한 B2C 신제품에 집중한다', base:{cash:-15,revenue:22}, sub:{strategy:8,marketing:6}, tags:['b2c','aggressive','marketing-push'] },
        { text:'틈새시장 한 곳에 역량을 집중한다', base:{cash:5,revenue:8}, sub:{strategy:10}, tags:['focus','conservative'] },
      ]},
      { domain:'finance', question:'초기 자금은 어떻게 마련하나요?', options:[
        { text:'자기자본 위주로 보수적으로 운용한다', base:{cash:0}, sub:{finance:8}, tags:['finance-tight','reserve','conservative'] },
        { text:'벤처캐피탈 투자를 유치한다', base:{cash:45,revenue:-3}, sub:{finance:5}, tags:['vc','equity','growth'], setFlags:{vcFunded:true} },
        { text:'은행 대출로 공격적으로 확장한다', base:{cash:35}, sub:{finance:-6}, tags:['debt','finance-loose','aggressive'] },
      ]},
      { domain:'hr', question:'초기 조직은 어떻게 꾸리나요?', options:[
        { text:'소수 정예로 출발한다', base:{cash:8}, sub:{hr:4,ops:3}, tags:['lean','hr-cut'] },
        { text:'핵심 인재를 적극 영입한다', base:{cash:-12,morale:6}, sub:{hr:12}, tags:['hr-invest','talent'] },
        { text:'수평적 스타트업 문화를 구축한다', base:{morale:10}, sub:{hr:8}, tags:['culture','hr-invest'] },
      ]},
    ],
  },

  /* ── 마일스톤: 5년차 확장 기로 ── */
  {
    id:'y5_expansion', year:5, weight:100, category:'growth', title:'성장의 기로: 확장이냐 내실이냐',
    env:{ tags:['growth-phase'] },
    description:'창업 5년 차, 회사는 어느 정도 자리를 잡았습니다. 이제 더 큰 도약을 노릴지, 내실을 다질지 중대한 갈림길에 섰습니다.',
    decisions:[
      { domain:'strategy', question:'성장 전략을 선택하세요.', options:[
        { text:'신규 시장·해외로 공격적으로 확장한다', base:{cash:-25,revenue:18}, sub:{strategy:10,marketing:5}, tags:['global','aggressive','growth','diversify'] },
        { text:'기존 사업의 점유율을 굳힌다', base:{cash:5,revenue:8}, sub:{strategy:6,ops:5}, tags:['focus','conservative'] },
        { text:'사업 포트폴리오를 다각화한다', base:{cash:-15,revenue:12}, sub:{strategy:8}, tags:['diversify','growth'] },
      ]},
      { domain:'ops', question:'생산/서비스 역량을 어떻게 키우나요?', options:[
        { text:'대규모 설비·인프라에 투자한다', base:{cash:-30,revenue:6}, sub:{ops:15}, tags:['capex','quality-up'] },
        { text:'외주·아웃소싱으로 유연하게 간다', base:{cash:-5,revenue:4}, sub:{ops:5}, tags:['outsource','lean'] },
        { text:'공정 자동화로 효율을 높인다', base:{cash:-18}, sub:{ops:10,mis:8}, tags:['automate','mis-automation'] },
      ]},
      { domain:'marketing', question:'마케팅 전략은?', options:[
        { text:'대규모 브랜드 캠페인을 집행한다', base:{cash:-22,revenue:15,reputation:8}, sub:{marketing:14}, tags:['marketing-push','brand'] },
        { text:'가격 경쟁력으로 점유율을 늘린다', base:{revenue:12,reputation:-4}, sub:{marketing:6}, tags:['price-cut','marketing-push'] },
        { text:'프리미엄 포지셔닝을 강화한다', base:{cash:-8,revenue:6,reputation:10}, sub:{marketing:10}, tags:['premium','brand'] },
      ]},
      { domain:'finance', question:'확장 재원은 어떻게 조달하나요?', options:[
        { text:'현금을 비축하며 신중히 간다', base:{cash:10}, sub:{finance:10}, tags:['reserve','finance-tight','conservative'] },
        { text:'대규모 차입으로 실탄을 확보한다', base:{cash:30}, sub:{finance:-8}, tags:['debt','finance-loose','aggressive'] },
        { text:'유상증자로 자본을 확충한다', base:{cash:25,revenue:-2}, sub:{finance:3}, tags:['equity'] },
      ]},
    ],
  },

  /* ── 마일스톤: 10년차 대형 위기 ── */
  {
    id:'y10_crisis', year:10, weight:100, category:'crisis', title:'창사 이래 최대 위기',
    env:{ tags:['recession','shock'] },
    description:'글로벌 경기 침체와 시장 급변이 겹쳤습니다. 매출이 흔들리고 내부 동요도 큽니다. 위기를 어떻게 돌파할지가 회사의 미래를 가릅니다.',
    decisions:[
      { domain:'strategy', question:'위기 대응 기조를 정하세요.', options:[
        { text:'비핵심 사업을 과감히 정리하고 집중한다', base:{cash:20,revenue:-6}, sub:{strategy:10}, tags:['focus','conservative','restructure'] },
        { text:'위기를 기회 삼아 경쟁사를 인수한다', base:{cash:-35,revenue:15}, sub:{strategy:12}, tags:['ma','aggressive','growth'] },
        { text:'버티며 시장 회복을 기다린다', base:{cash:-5}, sub:{strategy:3}, tags:['conservative','reserve'] },
      ]},
      { domain:'hr', question:'인력 운영은 어떻게 하나요?', options:[
        { text:'구조조정으로 비용을 줄인다', base:{cash:18,morale:-18,reputation:-10}, sub:{hr:-12}, tags:['layoff','hr-cut'] },
        { text:'고용을 지키고 임금을 일부 동결한다', base:{cash:-5,morale:5}, sub:{hr:6}, tags:['hr-invest','culture'] },
        { text:'직무 재배치로 위기를 함께 넘는다', base:{cash:3,morale:2}, sub:{hr:8,ops:4}, tags:['culture','hr-invest'] },

/* =========================================================
   PROFIT_TAGS: 선택 태그가 수익성(영업이익률)에 주는 영향
   - 매년 선택된 옵션들의 태그를 합산해 수익성 지표에 반영
   ========================================================= */
const PROFIT_TAGS = {
  premium:5, lean:5, automate:4, reserve:3, 'finance-tight':3, conservative:2,
  focus:2, 'quality-up':1, transparent:1, 'mis-automation':2, 'cost-cut':5,
  'price-cut':-5, aggressive:-4, 'marketing-push':-3, capex:-4, debt:-2,
  'finance-loose':-3, vc:-1, global:-2, diversify:-2, 'hr-invest':-1,
};
function profitFromTags(tagSet){
  let d=0; tagSet.forEach(t=>{ if(PROFIT_TAGS[t]!=null) d+=PROFIT_TAGS[t]; }); return d;
}

/* =========================================================
   STATE
   ========================================================= */
let state = null;
let selections = {};   // 현재 시나리오의 영역별 선택 {domain: optIdx}
let lastResult = null; // 직전 결산 결과 (결과 패널/대시보드 delta용)

function freshState(){
  return {
    company: CONFIG.COMPANY,
    year:1,
    stats:{ ...CONFIG.START_STATS },
    sub:{ ...CONFIG.START_SUB },
    flags:{},
    history:[],
    seenScenarios:[],
    phase:'scenario',
    gameOver:false,
    endingId:null,
    pendingId:null,
  };
}

/* =========================================================
   ENGINE
   ========================================================= */
function clampStat(key,v){
  if(key==='cash') return Math.round(v);          // 하한 없음(파산 가능)
  return Math.max(0, Math.min(100, Math.round(v)));
}
function clampSub(v){ return Math.max(0, Math.min(100, Math.round(v))); }

function addInto(acc,obj){ if(!obj) return; for(const k in obj){ acc[k]=(acc[k]||0)+obj[k]; } }
function mergeFlags(target,src){
  if(!src) return;
  for(const k in src){
    const v=src[k];
    if(typeof v==='number' && typeof target[k]==='number') target[k]+=v;
    else target[k]=v;
  }
}

function isEligible(sc){
  // 연차 조건
  if(sc.year!=null){ if(sc.year!==state.year) return false; }
  else {
    if(sc.yearMin!=null && state.year<sc.yearMin) return false;
    if(sc.yearMax!=null && state.year>sc.yearMax) return false;
  }
  // requires
  const r=sc.requires;
  if(r){
    if(r.flags){ for(const k in r.flags){ if((state.flags[k]||false)!=r.flags[k]) return false; } }
    if(r.statsMin){ for(const k in r.statsMin){ if(state.stats[k]<r.statsMin[k]) return false; } }
    if(r.statsMax){ for(const k in r.statsMax){ if(state.stats[k]>r.statsMax[k]) return false; } }
    if(r.subMin){ for(const k in r.subMin){ if(state.sub[k]<r.subMin[k]) return false; } }
    if(r.subMax){ for(const k in r.subMax){ if(state.sub[k]>r.subMax[k]) return false; } }
  }
  if(sc.conditions && !sc.conditions(state)) return false;
  return true;
}

function weightedPick(list){
  const total=list.reduce((a,s)=>a+(s.weight||10),0);
  let r=Math.random()*total;
  for(const s of list){ r-=(s.weight||10); if(r<=0) return s; }
  return list[list.length-1];
}

function pickScenario(){
  const eligible = SCENARIOS.filter(sc=> isEligible(sc) && !state.seenScenarios.includes(sc.id));
  // 고정 마일스톤(해당 연차 anchor)이 있으면 우선
  const anchors = eligible.filter(sc=> sc.year===state.year);
  let chosen;
  if(anchors.length) chosen = anchors[0];
  else {
    const pool = eligible.filter(sc=> !sc.filler);
    if(pool.length) chosen = weightedPick(pool);
    else {
      const fillers = eligible.filter(sc=> sc.filler);
      chosen = fillers.length ? weightedPick(fillers)
                              : weightedPick(SCENARIOS.filter(sc=>sc.filler)); // seen 무시 폴백
    }
  }
  state.pendingId = chosen.id;
  state.seenScenarios.push(chosen.id);
  return chosen;
}
function currentScenario(){ return SCENARIOS.find(s=>s.id===state.pendingId); }

function resolveYear(scenario){
  const before = { ...state.stats };
  const beforeSub = { ...state.sub };

  // 연간 시장 압력(엔트로피): 투자하지 않으면 경쟁에 밀려 지표가 서서히 하락한다
  state.stats.revenue=clampStat('revenue', state.stats.revenue-3);
  state.stats.profit=clampStat('profit', state.stats.profit-2);
  state.stats.morale=clampStat('morale', state.stats.morale-3);
  state.stats.reputation=clampStat('reputation', state.stats.reputation-3);
  for(const k in DOMAINS) state.sub[k]=clampSub(state.sub[k]-3);

  const baseAcc={}, subAcc={};
  const tagSet=new Set();

  scenario.decisions.forEach(d=>{
    const opt = d.options[selections[d.domain]];
    addInto(baseAcc, opt.base);
    addInto(subAcc, opt.sub);
    if(opt.setFlags) mergeFlags(state.flags, opt.setFlags);
    (opt.tags||[]).forEach(t=>tagSet.add(t));
  });

  // 선택 조합이 수익성에 주는 영향(영업이익률)
  addInto(baseAcc, { profit: profitFromTags(tagSet) });

  const p={tags:tagSet};
  const envSet=new Set((scenario.env&&scenario.env.tags)||[]);
  const triggered=[];
  SYNERGIES.forEach(rule=>{
    let hit=false;
    try { hit = rule.when(p, state, envSet); } catch(e){ hit=false; }
    if(hit){
      addInto(baseAcc, rule.effects);
      addInto(subAcc, rule.sub);
      if(rule.setFlags) mergeFlags(state.flags, rule.setFlags);
      triggered.push({ type:rule.type, msg:rule.msg });
    }
  });

  // 적용
  for(const k in baseAcc) state.stats[k]=clampStat(k, (state.stats[k]||0)+baseAcc[k]);
  for(const k in subAcc) state.sub[k]=clampSub((state.sub[k]||0)+subAcc[k]);

  // 연간 영업손익(자금 유입) = 매출 규모 × 마진(수익성) + 평판 보정
  // 영업이익 = (매출력-38) × (0.4 + 수익성/130) : 수익성은 마진 배수로 작용
  const opIncome = Math.round((state.stats.revenue-38) * (0.4 + state.stats.profit/130) + (state.stats.reputation-50)*0.08);
  state.stats.cash = clampStat('cash', state.stats.cash + opIncome);

  const statDeltas={}; METRICS.forEach(m=>statDeltas[m.key]=state.stats[m.key]-before[m.key]);
  const subDeltas={}; for(const k in DOMAINS) subDeltas[k]=state.sub[k]-beforeSub[k];

  const picksDetail = scenario.decisions.map(d=>({
    domain:d.domain, text:d.options[selections[d.domain]].text
  }));

  state.history.push({
    year:state.year, scenarioId:scenario.id, title:scenario.title,
    picks:picksDetail, statDeltas, triggered:triggered.map(t=>t.type),
  });

  const over = checkGameOver();
  return { statDeltas, subDeltas, triggered, scenario, over, opIncome };
}

function checkGameOver(){
  if(state.stats.cash<0) return setOver('bankrupt');
  if(state.stats.morale<=0) return setOver('org_collapse');
  if(state.stats.reputation<=0) return setOver('brand_collapse');
  if(state.sub.accounting<=0 || (state.flags.fraudRisk||0)>=5) return setOver('fraud_caught');
  return false;
}
function setOver(id){ state.gameOver=true; state.endingId=id; state.phase='ending'; return true; }

function computeEnding(){
  for(const e of END_ENDINGS){ if(e.cond(state)){ state.endingId=e.id; return e; } }
  state.endingId='fragile';
  return END_ENDINGS.find(e=>e.id==='fragile');
}
function getEndingDef(id){
  return FAIL_ENDINGS[id] || END_ENDINGS.find(e=>e.id===id);
}

/* =========================================================
   HANDLERS
   ========================================================= */
function onSelectOption(domain, idx){
  selections[domain]=idx;
  save();
  renderScenario();
}

function onSettle(){
  const sc=currentScenario();
  if(Object.keys(selections).length < sc.decisions.length) return;
  lastResult = resolveYear(sc);
  state.phase = state.gameOver ? 'ending' : 'result';
  save();
  if(state.gameOver) renderEnding(); else renderResult();
  renderDashboard();
  window.scrollTo({top:0, behavior:'smooth'});
}

function onNext(){
  state.year++;
  lastResult=null;
  if(state.year>CONFIG.MAX_YEAR){
    computeEnding();
    state.phase='ending';
    save();
    renderEnding();
    renderDashboard();
  } else {
    selections={};
    pickScenario();
    state.phase='scenario';
    save();
    renderScenario();
    renderDashboard();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function restart(){
  if(!confirm('지금까지의 경영 기록이 사라집니다. 처음(회사 설립)부터 다시 시작할까요?')) return;
  localStorage.removeItem(CONFIG.SAVE_KEY);
  state=freshState();
  selections={}; lastResult=null;
  showStartScreen();
  window.scrollTo({top:0});
}

/* =========================================================
   RENDER
   ========================================================= */
function lvClass(v){ return v>=66?'lv-hi':(v>=33?'lv-mid':'lv-lo'); }
function cashLv(v){ return v<30?'lv-lo':(v<80?'lv-mid':'lv-hi'); }
function fmtDelta(v){ return v>0?'+'+v:(v<0?''+v:'0'); }
function deltaClass(v){ return v>0?'plus':(v<0?'minus':'zero'); }

function renderDashboard(){
  const d=lastResult?lastResult.statDeltas:null;
  const sd=lastResult?lastResult.subDeltas:null;
  let metricsHtml = METRICS.map(m=>{
    const v=state.stats[m.key];
    const pct = m.isCash ? Math.max(0,Math.min(100, v/200*100)) : v;
    const fillLv = m.isCash ? cashLv(v) : lvClass(v);
    const dv = d?d[m.key]:0;
    const deltaTxt = (d && dv!==0) ? `<div class="m-delta ${dv>0?'plus':'minus'}">${dv>0?'▲':'▼'}${Math.abs(dv)}</div>` : `<div class="m-delta"></div>`;
    const valColor = m.isCash ? (v<0?'color:var(--red)':(v<30?'color:var(--gold)':'')) : '';
    return `<div class="metric-card">
      <div class="m-name">${m.name}</div>
      <div class="m-val" style="${valColor}">${v}${m.unit||''}</div>
      ${deltaTxt}
      <div class="stat-bar"><div class="stat-fill ${fillLv}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  let subHtml = Object.keys(DOMAINS).map(k=>{
    const v=state.sub[k];
    const dv = sd?sd[k]:0;
    const mark = dv>0?'<span style="color:var(--green)">▲</span>':(dv<0?'<span style="color:var(--red)">▼</span>':'');
    return `<div class="sub-cell">
      <div class="s-name">${SUB_NAMES[k]}</div>
      <div class="s-val">${v}${mark}</div>
      <div class="sub-bar"><div class="stat-fill ${lvClass(v)}" style="width:${v}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('dashboard').innerHTML = `
    <div id="dash-head">
      <div id="dash-title">🏢 ${state.company||CONFIG.COMPANY}</div>
      <div id="dash-right">
        <div id="dash-year">${state.gameOver?'경영 종료':state.year+'년차'} / ${CONFIG.MAX_YEAR}년</div>
        <button id="reset-btn" onclick="restart()">↺ 리셋</button>
      </div>
    </div>
    <div class="metric-grid">${metricsHtml}</div>
    <div id="sub-strip">${subHtml}</div>`;

  const pf=document.getElementById('progressFill');
  pf.style.width = Math.min(100, (state.year-1)/CONFIG.MAX_YEAR*100 + (state.phase==='ending'?100/CONFIG.MAX_YEAR:0)) + '%';
  if(state.gameOver || state.phase==='ending') pf.style.width='100%';
}

}

        ${decisionsHtml}
        <button class="settle-btn" ${allSelected?'':'disabled'} onclick="onSettle()">이번 해 경영 결산 ▶</button>
        <div class="settle-hint">${allSelected?'결정들의 조합이 결과를 좌우합니다.':'모든 영역에서 하나씩 선택해야 결산할 수 있습니다.'}</div>
      </div>
    </div>`;
}

function renderResult(){
  const r=lastResult;
  const sc=r.scenario;

  // 영역별 선택 요약
  const picksHtml = sc.decisions.map(d=>{
    return `<div class="syn-msg neutral"><span class="syn-tag" style="color:${DOMAINS[d.domain].color}">[${DOMAINS[d.domain].label}]</span>${d.options[selections[d.domain]].text}</div>`;
  }).join('');

  // 시너지/상충
  const synHtml = r.triggered.length
    ? r.triggered.map(t=>`<div class="syn-msg ${t.type}"><span class="syn-tag">${t.type==='synergy'?'시너지 ✦':'상충 ⚠'}</span>${t.msg}</div>`).join('')
    : `<div class="syn-msg neutral">특별한 시너지나 상충 없이 무난하게 한 해가 마무리되었습니다.</div>`;

  // 4지표 delta
  const deltaCells = METRICS.map(m=>{
    const dv=r.statDeltas[m.key];
    return `<div class="delta-cell"><div class="d-name">${m.name}</div><div class="d-val ${deltaClass(dv)}">${fmtDelta(dv)}</div></div>`;
  }).join('');

  // 7기능 sub delta (변동 있는 것만)
  const subChanges = Object.keys(DOMAINS).filter(k=>r.subDeltas[k]!==0)
    .map(k=>`${SUB_NAMES[k]} <span class="${r.subDeltas[k]>0?'up':'down'}">${fmtDelta(r.subDeltas[k])}</span>`).join(' · ');

  document.getElementById('scenarioArea').innerHTML = `
    <div class="section-title">${r.scenario.title} · 결산 결과</div>
    <div class="result-panel">
      <h3>📋 의사결정 요약</h3>
      ${picksHtml}
      <h3 style="margin-top:14px;">⚡ 조합의 결과</h3>
      ${synHtml}
      ${r.opIncome!=null?`<div class="sub-delta-line">올해 영업 실적 — 자금 <span class="${r.opIncome>=0?'up':'down'}">${fmtDelta(r.opIncome)}억</span> 반영(매출·조직·평판 기반)</div>`:''}
      <div class="delta-grid">${deltaCells}</div>
      ${subChanges?`<div class="sub-delta-line">기능 역량 변화 — ${subChanges}</div>`:''}
      <button class="primary" style="margin-top:14px;" onclick="onNext()">${state.year>=CONFIG.MAX_YEAR?'경영 평가 보기 ▶':'다음 해로 ▶'}</button>
    </div>`;
}

function renderEnding(){
  const def=getEndingDef(state.endingId);
  const tone=def.tone;

  const finalStats = METRICS.map(m=>{
    const v=state.stats[m.key];
    return `<div class="metric-card"><div class="m-name">${m.name}</div><div class="m-val">${v}${m.unit||''}</div>
      <div class="stat-bar"><div class="stat-fill ${m.isCash?cashLv(v):lvClass(v)}" style="width:${m.isCash?Math.max(0,Math.min(100,v/200*100)):v}%"></div></div></div>`;
  }).join('');

  // 타임라인 회고 (주요 시너지/위기 위주, 최대 8개)
  const notable = state.history.filter(h=>h.triggered.length>0);
  const tlSource = (notable.length?notable:state.history).slice(-8);
  const timeline = tlSource.map(h=>{
    const key = h.picks[0] ? `[${DOMAINS[h.picks[0].domain].label}] ${h.picks[0].text}` : h.title;
    const synNote = h.triggered.length ? ` <span style="color:${h.triggered.includes('conflict')?'var(--red)':'var(--green)'}">(${h.triggered.includes('conflict')?'난관':'시너지'})</span>` : '';
    return `<div class="tl-item"><span class="tl-year">${h.year}년차</span>${h.title}${synNote}</div>`;
  }).join('');

  const finalYear = state.gameOver ? `${state.year}년차에 경영이 중단되었습니다.` : `15년의 임기를 완주했습니다.`;

  document.getElementById('scenarioArea').style.display='none';
  const es=document.getElementById('endingScreen');
  es.style.display='block';
  es.innerHTML = `
    <div class="ending-emoji">${def.emoji}</div>
    <div class="ending-title ${tone}">${def.title}</div>
    <div class="ending-sub">${state.company||CONFIG.COMPANY} · ${finalYear}</div>
    <div class="ending-text">${def.text}</div>
    <div class="section-title">최종 경영 지표</div>
    <div class="final-stats">${finalStats}</div>
    <div class="timeline">
      <h4>📜 경영 발자취</h4>
      ${timeline||'<div class="tl-item">기록이 없습니다.</div>'}
    </div>
    <button class="primary" onclick="restart()">🔄 새 게임 시작</button>
    <button class="ghost" onclick="restart()">처음부터 다시 도전하기</button>`;
}

/* =========================================================
   STORAGE
   ========================================================= */
function save(){
  try{
    localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify({ ver:CONFIG.SAVE_VER, state, selections, lastResultMeta:null }));
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(CONFIG.SAVE_KEY);
    if(!raw) return false;
    const data=JSON.parse(raw);
    if(data.ver!==CONFIG.SAVE_VER || !data.state) return false;
    state=data.state;
    selections=data.selections||{};
    return true;
  }catch(e){ return false; }
}

/* =========================================================
   INIT
   ========================================================= */
function init(){
  const loaded=load();
  if(!loaded){
    // 새 게임 → 회사명 입력 시작 화면
    state=freshState();
    selections={};
    showStartScreen();
    return;
  }
  // 저장 복원 시 대시보드 표시
  document.getElementById('startScreen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  if(state.phase==='ending'){
    if(!state.gameOver && state.endingId==null) computeEnding();
    renderEnding();
  } else if(state.phase==='result'){
    // 직전 결산 효과는 이미 state에 반영됨. lastResult는 복원되지 않으므로
    // 결과 화면을 다시 그리는 대신 다음 해로 진행시켜 효과 중복 적용을 방지한다.
    lastResult=null;
    onNext();
    return;
  } else {
    if(!currentScenario()) pickScenario();
    renderScenario();
  }
  renderDashboard();
}

init();
</script>
</body>
</html>
