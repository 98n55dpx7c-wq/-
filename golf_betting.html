<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>스골왕과 함께하는 골프내기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    background: #1a2332;
    color: #e8edf3;
    min-height: 100vh;
  }

  /* ── Sticky scoreboard ── */
  #scoreboard {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #0f1923;
    border-bottom: 2px solid #2d4a6e;
    padding: 10px 12px 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #scoreboard h2 {
    text-align: center;
    font-size: 13px;
    color: #7a9fc2;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .score-grid {
    display: grid;
    gap: 6px;
  }
  .score-card {
    background: #1e3048;
    border-radius: 10px;
    padding: 8px 4px;
    text-align: center;
    border: 1px solid #2d4a6e;
    transition: border-color 0.2s;
  }
  .score-card .name {
    font-size: 13px;
    font-weight: 700;
    color: #a8c8e8;
    margin-bottom: 4px;
  }
  .score-card .amount {
    font-size: 16px;
    font-weight: 800;
    transition: color 0.3s;
  }
  .score-card .amount.plus { color: #4ec97a; }
  .score-card .amount.minus { color: #ff6b6b; }
  .score-card .amount.zero { color: #7a9fc2; }

  /* ── Main content ── */
  main { padding: 12px; max-width: 600px; margin: 0 auto; }

  /* ── Hole card ── */
  .hole-card {
    background: #1e2d40;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid #2a3f58;
  }
  .hole-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: #162336;
    cursor: pointer;
    user-select: none;
  }
  .hole-header:active { background: #1a2d42; }
  .hole-title {
    font-size: 15px;
    font-weight: 700;
    color: #d0e8ff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hole-badges { display: flex; gap: 4px; flex-wrap: wrap; }
  .badge {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge-birdie    { background: #1a4a2e; color: #4ec97a; border: 1px solid #4ec97a; }
  .badge-yangpa    { background: #4a1a1a; color: #ff6b6b; border: 1px solid #ff6b6b; }
  .badge-eagle     { background: #1a3a4a; color: #4ec9c9; border: 1px solid #4ec9c9; }
  .badge-albatross { background: #0e2030; color: #a0e8ff; border: 1px solid #a0e8ff; }
  .badge-holeinone { background: #2a1a4a; color: #d0a0ff; border: 1px solid #d0a0ff; }
  .badge-baeban    { background: #3a2200; color: #ffb340; border: 1px solid #ffb340; font-weight: 800; }
  .hole-toggle { color: #5a7a9a; font-size: 18px; transition: transform 0.2s; }
  .hole-toggle.open { transform: rotate(180deg); }

  .hole-body { padding: 12px 14px; }

  /* Par + score inputs */
  .input-row {
    display: grid;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }
  .input-label {
    font-size: 11px;
    color: #5a7a9a;
    text-align: center;
    margin-bottom: 3px;
  }
  .input-col { display: flex; flex-direction: column; align-items: center; }
  .score-input {
    width: 100%;
    background: #132030;
    border: 1.5px solid #2a4060;
    border-radius: 8px;
    color: #e8edf3;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    padding: 8px 4px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
    transition: border-color 0.2s, background 0.2s;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-input:focus { border-color: #4a8fc2; background: #1a2d42; }
  .score-input.birdie    { border-color: #4ec97a; background: #122a1e; }
  .score-input.eagle     { border-color: #4ec9c9; background: #0e2530; }
  .score-input.albatross { border-color: #a0e8ff; background: #0a1e30; }
  .score-input.holeinone { border-color: #d0a0ff; background: #1a0a2e; }
  .score-input.yangpa    { border-color: #ff6b6b; background: #2a1212; }
  .score-input.par       { border-color: #5a8abf; }

  /* Hole results */
  .hole-result {
    background: #132030;
    border-radius: 10px;
    padding: 10px;
    margin-top: 4px;
  }
  .result-title {
    font-size: 11px;
    color: #5a7a9a;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .result-grid {
    display: grid;
    gap: 4px;
  }
  .result-cell {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 2px;
    border-radius: 6px;
    background: #1a2d42;
  }
  .result-cell .r-name { font-size: 11px; color: #7a9fc2; margin-bottom: 2px; }
  .result-cell .r-amt { }
  .result-cell.plus  { background: #142a1e; }
  .result-cell.minus { background: #2a1414; }
  .result-cell .r-amt.plus  { color: #4ec97a; }
  .result-cell .r-amt.minus { color: #ff6b6b; }
  .result-cell .r-amt.zero  { color: #5a7a9a; }

  /* ── Section separator ── */
  .section-title {
    text-align: center;
    color: #5a7a9a;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 0 4px;
  }

  /* ── Final settlement ── */
  #settlement {
    background: #1e2d40;
    border-radius: 14px;
    padding: 14px;
    margin-top: 8px;
    border: 1px solid #2a3f58;
  }
  #settlement h3 {
    text-align: center;
    font-size: 14px;
    color: #a8c8e8;
    margin-bottom: 12px;
    letter-spacing: 1px;
  }
  .settle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #132030;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .settle-arrow { color: #5a7a9a; font-size: 16px; }
  .settle-from { color: #ff8f8f; font-weight: 700; }
  .settle-to   { color: #4ec97a; font-weight: 700; }
  .settle-amt  { color: #f0c060; font-weight: 800; font-size: 16px; }
  .no-settle   { color: #5a7a9a; text-align: center; font-size: 13px; padding: 8px; }

  /* ── Reset button ── */
  #resetBtn {
    display: block;
    width: 100%;
    margin: 16px 0 24px;
    padding: 14px;
    background: #2a1a1a;
    color: #ff6b6b;
    border: 1.5px solid #6b2020;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  #resetBtn:active { background: #3a1a1a; }

  /* ── Holbar progress ── */
  #progressBar {
    height: 4px;
    background: #0f1923;
    position: sticky;
    top: 0;
    z-index: 101;
  }
  #progressFill {
    height: 100%;
    background: linear-gradient(90deg, #2d6a9f, #4ec97a);
    transition: width 0.4s ease;
    width: 0%;
  }

  /* ── Hole number indicator ── */
  .hole-num-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #2d4a6e;
    color: #a8c8e8;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .hole-num-badge.front { background: #1a4060; }
  .hole-num-badge.back  { background: #2a2060; }

  /* ── Setup view ── */
  #setupView {
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 12px 40px;
  }
  #setupCard {
    width: 100%;
    max-width: 480px;
    background: #1e2d40;
    border-radius: 16px;
    padding: 24px 18px;
    border: 1px solid #2a3f58;
  }
  #setupCard h1 {
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: #d0e8ff;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  .setup-section {
    margin-bottom: 22px;
  }
  .setup-label {
    font-size: 12px;
    font-weight: 700;
    color: #7a9fc2;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  /* pill button groups */
  .pill-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill-btn {
    flex: 1;
    min-width: 48px;
    padding: 9px 6px;
    background: #132030;
    border: 1.5px solid #2a4060;
    border-radius: 8px;
    color: #7a9fc2;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .pill-btn.active {
    background: #1a3d5c;
    border-color: #4a8fc2;
    color: #d0e8ff;
  }
  /* player name inputs */
  .player-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .player-name-label {
    font-size: 13px;
    color: #7a9fc2;
    min-width: 60px;
  }
  .player-name-input {
    flex: 1;
    background: #132030;
    border: 1.5px solid #2a4060;
    border-radius: 8px;
    color: #e8edf3;
    font-size: 15px;
    font-weight: 600;
    padding: 9px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .player-name-input:focus { border-color: #4a8fc2; }
  /* unit custom input */
  #customUnitWrap {
    margin-top: 8px;
    display: none;
  }
  #customUnitInput {
    width: 100%;
    background: #132030;
    border: 1.5px solid #2a4060;
    border-radius: 8px;
    color: #e8edf3;
    font-size: 15px;
    font-weight: 600;
    padding: 9px 10px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
    transition: border-color 0.2s;
  }
  #customUnitInput:focus { border-color: #4a8fc2; }
  #customUnitInput::-webkit-outer-spin-button,
  #customUnitInput::-webkit-inner-spin-button { -webkit-appearance: none; }
  /* rule rows */
  .rule-row {
    display: flex;
    align-items: center;
    background: #132030;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    gap: 8px;
  }
  .rule-name {
    flex: 1;
    font-size: 14px;
    font-weight: 600;
    color: #d0e8ff;
  }
  .rule-mult-label {
    font-size: 13px;
    color: #7a9fc2;
  }
  .rule-mult-input {
    width: 46px;
    background: #1e3048;
    border: 1.5px solid #2a4060;
    border-radius: 6px;
    color: #e8edf3;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    padding: 5px 4px;
    outline: none;
    -moz-appearance: textfield;
    appearance: textfield;
    transition: border-color 0.2s, opacity 0.2s;
  }
  .rule-mult-input::-webkit-outer-spin-button,
  .rule-mult-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .rule-mult-input:focus { border-color: #4a8fc2; }
  .rule-mult-input:disabled { opacity: 0.35; }
  /* toggle switch */
  .toggle-wrap { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .toggle-wrap input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #2a4060;
    border-radius: 24px;
    transition: background 0.2s;
  }
  .toggle-slider:before {
    content: '';
    position: absolute;
    height: 18px; width: 18px;
    left: 3px; bottom: 3px;
    background: #7a9fc2;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle-wrap input:checked + .toggle-slider { background: #1a4a2e; }
  .toggle-wrap input:checked + .toggle-slider:before { transform: translateX(18px); background: #4ec97a; }
  /* yangpa threshold row */
  .threshold-row {
    background: #0e1e2e;
    border-radius: 10px;
    padding: 10px 12px;
    margin-top: -4px;
    margin-bottom: 8px;
    border: 1px solid #1e3048;
  }
  .threshold-label {
    font-size: 12px;
    color: #5a7a9a;
    margin-bottom: 8px;
    display: block;
  }
  .threshold-row .pill-btn {
    font-size: 12px;
    padding: 7px 4px;
    line-height: 1.3;
  }
  .threshold-row .pill-btn small {
    font-size: 10px;
    color: #7a9fc2;
    display: block;
  }
  .threshold-row .pill-btn.active small { color: #a8d8f8; }
  #yangpaCustomWrap {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  /* start button */
  #startGameBtn {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 15px;
    background: #1a4a2e;
    color: #4ec97a;
    border: 1.5px solid #4ec97a;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.15s;
  }
  #startGameBtn:active { background: #224a30; }
  /* settings change button inside game view */
  #settingsBtn {
    display: block;
    width: calc(100% - 24px);
    max-width: 576px;
    margin: 8px auto 0;
    padding: 10px;
    background: transparent;
    color: #5a7a9a;
    border: 1px solid #2a3f58;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
  }
  #settingsBtn:active { background: #1a2d40; }

  /* ── Per-hole mini amounts in header ── */
  .hole-header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .hole-mini-amounts {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 160px;
  }
  .mini-amt {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 4px;
    background: #0e1e2e;
    white-space: nowrap;
  }
  .mini-amt.plus  { color: #4ec97a; }
  .mini-amt.minus { color: #ff6b6b; }
  .mini-amt.zero  { color: #5a7a9a; }

  /* ── Settlement rankings ── */
  .rank-section { margin-bottom: 16px; }
  .rank-section-title {
    font-size: 11px;
    color: #5a7a9a;
    text-align: center;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .rank-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: #132030;
    border: 1px solid transparent;
  }
  .rank-row.rank-1st { background: #1a2a10; border-color: #4a8a20; }
  .rank-row.rank-last { background: #2a1010; border-color: #6a2020; }
  .rank-medal { font-size: 18px; flex-shrink: 0; width: 26px; text-align: center; }
  .rank-name  { flex: 1; font-size: 15px; font-weight: 700; color: #d0e8ff; }
  .rank-score { font-size: 12px; color: #7a9fc2; margin-right: 4px; }
  .rank-amt   { font-size: 15px; font-weight: 800; }
  .rank-amt.plus  { color: #4ec97a; }
  .rank-amt.minus { color: #ff6b6b; }
  .rank-amt.zero  { color: #5a7a9a; }
  .settle-divider {
    height: 1px;
    background: #2a3f58;
    margin: 14px 0;
  }
  .settle-subtitle {
    font-size: 11px;
    color: #5a7a9a;
    text-align: center;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ── Scoreboard improvements ── */
  #scoreboard h2 { margin-bottom: 6px; }
  .score-card {
    background: linear-gradient(135deg, #1e3048 0%, #162336 100%);
  }
  .score-card .amount { font-size: 15px; }

  /* ── Progress bar above scoreboard ── */
  #progressBar {
    top: 0;
  }

  /* ── Hole card improvements ── */
  .hole-card { box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  .hole-header { transition: background 0.15s; }

  /* ── Settings/reset button improvements ── */
  #settingsBtn { letter-spacing: 0.3px; }
  #resetBtn { transition: background 0.15s, border-color 0.15s; }
  #resetBtn:hover { background: #331a1a; border-color: #8b2020; }
</style>
</head>
<body>

<!-- ── 설정 화면 ── -->
<div id="setupView">
  <div id="setupCard">
    <h1>⛳ 스골왕과 함께하는 골프내기</h1>

    <!-- 플레이어 수 -->
    <div class="setup-section">
      <div class="setup-label">참여 인원</div>
      <div class="pill-group" id="playerCountBtns">
        <button class="pill-btn" onclick="onPlayerCountChange(2)">2명</button>
        <button class="pill-btn" onclick="onPlayerCountChange(3)">3명</button>
        <button class="pill-btn active" onclick="onPlayerCountChange(4)">4명</button>
        <button class="pill-btn" onclick="onPlayerCountChange(5)">5명</button>
        <button class="pill-btn" onclick="onPlayerCountChange(6)">6명</button>
      </div>
    </div>

    <!-- 이름 입력 -->
    <div class="setup-section">
      <div class="setup-label">플레이어 이름</div>
      <div id="playerNameInputs"></div>
    </div>

    <!-- 타당 금액 -->
    <div class="setup-section">
      <div class="setup-label">타당 금액</div>
      <div class="pill-group" id="unitBtns">
        <button class="pill-btn active" onclick="onUnitSelect(1000)">₩1,000</button>
        <button class="pill-btn" onclick="onUnitSelect(2000)">₩2,000</button>
        <button class="pill-btn" onclick="onUnitSelect(5000)">₩5,000</button>
        <button class="pill-btn" onclick="onUnitSelect('custom')">직접입력</button>
      </div>
      <div id="customUnitWrap">
        <input type="number" id="customUnitInput" placeholder="금액을 입력하세요 (원)" min="100" step="100">
      </div>
    </div>

    <!-- 게임 조건 -->
    <div class="setup-section">
      <div class="setup-label">게임 조건</div>

      <!-- 버디 -->
      <div class="rule-row">
        <span class="rule-name">🐦 버디 보너스</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="birdieOn" checked onchange="onRuleToggle('birdie')">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="birdieModeWrap" class="threshold-row">
        <span class="threshold-label">보너스 방식</span>
        <div class="pill-group" id="birdieModeButtons">
          <button class="pill-btn active" onclick="onBirdieMode('multiplier')">배수 방식<br><small>타수×배수 지급</small></button>
          <button class="pill-btn" onclick="onBirdieMode('flat')">+1타 방식<br><small>버디 시 1타 추가</small></button>
        </div>
        <div id="birdieMultRow" style="display:flex; align-items:center; gap:8px; margin-top:8px;">
          <span class="rule-mult-label">배수</span>
          <input class="rule-mult-input" id="birdieMultiplier" type="number" min="1" max="20" value="2">
          <span class="rule-mult-label">배</span>
        </div>
      </div>

      <!-- 이글 -->
      <div class="rule-row">
        <span class="rule-name">🦅 이글 보너스</span>
        <span class="rule-mult-label">배수</span>
        <input class="rule-mult-input" id="eagleMultiplier" type="number" min="1" max="20" value="3">
        <span class="rule-mult-label">배</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="eagleOn" onchange="onRuleToggle('eagle')">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- 알바트로스 -->
      <div class="rule-row">
        <span class="rule-name">🦅🦅 알바트로스 보너스</span>
        <span class="rule-mult-label">배수</span>
        <input class="rule-mult-input" id="albatrossMultiplier" type="number" min="1" max="20" value="5">
        <span class="rule-mult-label">배</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="albatrossOn" onchange="onRuleToggle('albatross')">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- 홀인원 -->
      <div class="rule-row">
        <span class="rule-name">⛳ 홀인원 보너스</span>
        <span class="rule-mult-label">배수</span>
        <input class="rule-mult-input" id="holeinoneMultiplier" type="number" min="1" max="20" value="5">
        <span class="rule-mult-label">배</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="holeinoneOn" onchange="onRuleToggle('holeinone')">
          <span class="toggle-slider"></span>
        </label>
      </div>

      <!-- 양파 -->
      <div class="rule-row">
        <span class="rule-name">🧅 양파 패널티</span>
        <span class="rule-mult-label">배수</span>
        <input class="rule-mult-input" id="yangpaMultiplier" type="number" min="1" max="20" value="2">
        <span class="rule-mult-label">배</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="yangpaOn" checked onchange="onRuleToggle('yangpa')">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <!-- 양파 기준 -->
      <div id="yangpaThresholdWrap" class="threshold-row">
        <span class="threshold-label">양파 기준</span>
        <div class="pill-group" id="yangpaThresholdBtns">
          <button class="pill-btn active" onclick="onYangpaThreshold('double_par')">더블파<br><small>파×2</small></button>
          <button class="pill-btn" onclick="onYangpaThreshold('double_bogey')">더블보기<br><small>파+2</small></button>
          <button class="pill-btn" onclick="onYangpaThreshold('custom')">직접 설정</button>
        </div>
        <div id="yangpaCustomWrap" style="display:none; margin-top:8px; display:none">
          <span class="rule-mult-label">파 +</span>
          <input class="rule-mult-input" id="yangpaCustomOffset" type="number" min="1" max="10" value="3">
          <span class="rule-mult-label">타 이상</span>
        </div>
      </div>
    </div>

    <!-- 배판 설정 -->
    <div class="setup-section">
      <div class="setup-label">배판 설정</div>
      <div class="rule-row">
        <span class="rule-name">🔁 동점 시 배판 자동 적용</span>
        <label class="toggle-wrap">
          <input type="checkbox" id="baebanOn" checked onchange="onBaebanToggle()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div id="baebanDetailWrap" class="threshold-row">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <span class="threshold-label" style="margin:0">최대 배판 배수</span>
          <input class="rule-mult-input" id="baebanMaxMult" type="number" min="2" max="10" value="3">
          <span class="rule-mult-label">배</span>
          <span class="threshold-label" style="margin:0; font-size:11px;">(버디/양파 포함 합산)</span>
        </div>
      </div>
    </div>

    <button id="startGameBtn" onclick="startGame()">게임 시작 →</button>
  </div>
</div>

<!-- ── 게임 화면 ── -->
<div id="gameView" style="display:none">
  <div id="progressBar"><div id="progressFill"></div></div>

  <div id="scoreboard">
    <h2>💰 누적 잔액</h2>
    <div class="score-grid" id="scoreGrid"></div>
  </div>

  <button id="settingsBtn" onclick="openSettings()">⚙ 설정 변경 / 새 게임</button>

  <main>
    <div id="holesContainer"></div>

    <div class="section-title">⛳ 최종 정산</div>
    <div id="settlement">
      <div id="settlementBody"><p class="no-settle">점수를 입력하면 정산이 계산됩니다.</p></div>
    </div>

    <button id="resetBtn" onclick="resetScores()">🔄 점수만 초기화</button>
  </main>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const HOLES = 18;

let CONFIG = {
  players: ['플레이어1', '플레이어2', '플레이어3', '플레이어4'],
  unit: 1000,
  rules: {
    birdie:    { enabled: true,  mult: 2 },
    eagle:     { enabled: false, mult: 3 },
    albatross: { enabled: false, mult: 5 },
    holeinone: { enabled: false, mult: 5 },
    yangpa:    { enabled: true,  mult: 2, threshold: 'double_par', customOffset: 3 },
    baeban:    { enabled: true, maxMult: 3 },
  }
};

let gameData = [];

function freshGameData() {
  return Array.from({length: HOLES}, () => ({
    par: 4,
    scores: Array(CONFIG.players.length).fill(null)
  }));
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  const cfg = loadConfig();
  if (cfg) {
    CONFIG = cfg;
    const data = loadGameData();
    if (data) {
      gameData = data;
      showGameView();
      return;
    }
  }
  // No valid saved state → show setup
  showSetupView();
}

function showSetupView() {
  document.getElementById('setupView').style.display  = 'flex';
  document.getElementById('gameView').style.display   = 'none';
  renderSetupForm();
}

function showGameView() {
  document.getElementById('setupView').style.display  = 'none';
  document.getElementById('gameView').style.display   = 'block';
  buildScoreboard();
  buildHoles();
  updateAll();
  // Open first hole
  const tog = document.getElementById('toggle-0');
  if (tog) tog.classList.add('open');
}

// ─────────────────────────────────────────────
// SETUP SCREEN
// ─────────────────────────────────────────────
let setupUnit = 1000; // tracks selected unit in setup form

function renderSetupForm() {
  const n = CONFIG.players.length;
  document.querySelectorAll('#playerCountBtns .pill-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === n + '명');
  });
  renderPlayerNameInputs(n);

  // Unit
  setupUnit = CONFIG.unit;
  const presets = [1000, 2000, 5000];
  const isPreset = presets.includes(setupUnit);
  document.querySelectorAll('#unitBtns .pill-btn').forEach(btn => {
    const v = btn.dataset.unit;
    btn.classList.toggle('active',
      (v === 'custom' && !isPreset) ||
      (v !== 'custom' && parseInt(v) === setupUnit)
    );
  });
  document.getElementById('customUnitWrap').style.display = isPreset ? 'none' : 'block';
  if (!isPreset) document.getElementById('customUnitInput').value = setupUnit;

  // Rules: eagle, albatross, holeinone, yangpa
  ['eagle', 'albatross', 'holeinone', 'yangpa'].forEach(r => {
    const rule = CONFIG.rules[r];
    if (!rule) return;
    document.getElementById(r + 'On').checked = rule.enabled;
    document.getElementById(r + 'Multiplier').value = rule.mult;
    document.getElementById(r + 'Multiplier').disabled = !rule.enabled;
  });
  // Birdie (mode 포함)
  const birdieRule = CONFIG.rules.birdie;
  document.getElementById('birdieOn').checked = birdieRule.enabled;
  setupBirdieMode = birdieRule.mode || 'multiplier';
  onBirdieMode(setupBirdieMode);
  document.getElementById('birdieMultiplier').value = birdieRule.mult;
  document.getElementById('birdieModeWrap').style.opacity = birdieRule.enabled ? '1' : '0.4';
  document.getElementById('birdieModeWrap').style.pointerEvents = birdieRule.enabled ? '' : 'none';

  // Yangpa threshold
  const threshold = CONFIG.rules.yangpa.threshold || 'double_par';
  onYangpaThreshold(threshold, false); // false = don't reset customOffset
  if (threshold === 'custom') {
    document.getElementById('yangpaCustomOffset').value = CONFIG.rules.yangpa.customOffset || 3;
  }

  // 배판
  const baeban = CONFIG.rules.baeban || { enabled: true, maxMult: 3 };
  document.getElementById('baebanOn').checked = baeban.enabled;
  document.getElementById('baebanMaxMult').value = baeban.maxMult || 3;
  document.getElementById('baebanDetailWrap').style.opacity = baeban.enabled ? '1' : '0.4';
  document.getElementById('baebanDetailWrap').style.pointerEvents = baeban.enabled ? '' : 'none';
}

function renderPlayerNameInputs(count) {
  const existing = [...document.querySelectorAll('.player-name-input')].map(el => el.value);
  const container = document.getElementById('playerNameInputs');
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const row = document.createElement('div');
    row.className = 'player-name-row';
    const placeholder = '플레이어' + (i + 1);
    const val = (existing[i] !== undefined ? existing[i] : '') || (CONFIG.players[i] !== placeholder ? (CONFIG.players[i] || '') : '');
    row.innerHTML = `
      <span class="player-name-label">플레이어 ${i + 1}</span>
      <input class="player-name-input" type="text" maxlength="8"
        placeholder="${placeholder}"
        value="${escapeHtml(val)}"
        data-idx="${i}">
    `;
    container.appendChild(row);
  }
}

function onPlayerCountChange(n) {
  document.querySelectorAll('#playerCountBtns .pill-btn').forEach((btn, idx) => {
    btn.classList.toggle('active', idx + 2 === n);
  });
  renderPlayerNameInputs(n);
}

function onUnitSelect(val) {
  setupUnit = val === 'custom' ? 'custom' : val;
  document.querySelectorAll('#unitBtns .pill-btn').forEach(btn => {
    const bv = btn.dataset.unit;
    btn.classList.toggle('active',
      (bv === 'custom' && val === 'custom') ||
      (bv !== 'custom' && parseInt(bv) === val)
    );
  });
  const wrap = document.getElementById('customUnitWrap');
  wrap.style.display = val === 'custom' ? 'block' : 'none';
  if (val !== 'custom') document.getElementById('customUnitInput').value = '';
}

function onRuleToggle(rule) {
  const enabled = document.getElementById(rule + 'On').checked;
  if (rule === 'birdie') {
    document.getElementById('birdieModeWrap').style.opacity = enabled ? '1' : '0.4';
    document.getElementById('birdieModeWrap').style.pointerEvents = enabled ? '' : 'none';
  } else {
    document.getElementById(rule + 'Multiplier').disabled = !enabled;
  }
  if (rule === 'yangpa') {
    document.getElementById('yangpaThresholdWrap').style.opacity = enabled ? '1' : '0.4';
    document.getElementById('yangpaThresholdWrap').style.pointerEvents = enabled ? '' : 'none';
  }
}

function onBaebanToggle() {
  const enabled = document.getElementById('baebanOn').checked;
  document.getElementById('baebanDetailWrap').style.opacity = enabled ? '1' : '0.4';
  document.getElementById('baebanDetailWrap').style.pointerEvents = enabled ? '' : 'none';
}

let setupBirdieMode = 'multiplier';

function onBirdieMode(val) {
  setupBirdieMode = val;
  document.querySelectorAll('#birdieModeButtons .pill-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === (val === 'multiplier' ? 0 : 1));
  });
  document.getElementById('birdieMultRow').style.display = val === 'multiplier' ? 'flex' : 'none';
}

let setupYangpaThreshold = 'double_par';

function onYangpaThreshold(val, resetCustom = true) {
  setupYangpaThreshold = val;
  document.querySelectorAll('#yangpaThresholdBtns .pill-btn').forEach((btn, i) => {
    const vals = ['double_par', 'double_bogey', 'custom'];
    btn.classList.toggle('active', vals[i] === val);
  });
  const customWrap = document.getElementById('yangpaCustomWrap');
  customWrap.style.display = val === 'custom' ? 'flex' : 'none';
  if (val === 'custom' && resetCustom) {
    document.getElementById('yangpaCustomOffset').value = 3;
  }
}

function startGame() {
  const activePill = document.querySelector('#playerCountBtns .pill-btn.active');
  const count = activePill ? parseInt(activePill.textContent) : 4;

  const nameEls = document.querySelectorAll('.player-name-input');
  const names = [...nameEls].map((el, i) => el.value.trim() || ('플레이어' + (i + 1)));
  if (new Set(names).size !== names.length) {
    alert('중복된 이름이 있습니다. 각자 다른 이름을 사용해주세요.');
    return;
  }

  let unit;
  if (setupUnit === 'custom') {
    unit = parseInt(document.getElementById('customUnitInput').value);
    if (!unit || unit < 100) { alert('올바른 금액을 입력하세요 (100원 이상).'); return; }
  } else {
    unit = setupUnit;
  }

  const rules = {};
  ['eagle', 'albatross', 'holeinone'].forEach(r => {
    const mult = parseInt(document.getElementById(r + 'Multiplier').value) || 2;
    rules[r] = { enabled: document.getElementById(r + 'On').checked, mult: Math.max(1, mult) };
  });
  // 버디 (mode 포함)
  const birdieMult = parseInt(document.getElementById('birdieMultiplier').value) || 2;
  rules.birdie = {
    enabled: document.getElementById('birdieOn').checked,
    mult: Math.max(1, birdieMult),
    mode: setupBirdieMode,
  };

  // Yangpa with threshold
  const yangpaMult = parseInt(document.getElementById('yangpaMultiplier').value) || 2;
  const customOffset = parseInt(document.getElementById('yangpaCustomOffset').value) || 3;
  rules.yangpa = {
    enabled: document.getElementById('yangpaOn').checked,
    mult: Math.max(1, yangpaMult),
    threshold: setupYangpaThreshold,
    customOffset: Math.max(1, customOffset),
  };

  // 배판
  const baebanMaxMult = parseInt(document.getElementById('baebanMaxMult').value) || 3;
  rules.baeban = {
    enabled: document.getElementById('baebanOn').checked,
    maxMult: Math.max(2, baebanMaxMult),
  };

  CONFIG = { players: names, unit, rules };
  gameData = freshGameData();
  saveConfig();
  saveGameData();
  showGameView();
}

function openSettings() {
  if (!confirm('설정을 변경하면 현재 게임 데이터가 초기화됩니다.\n계속하시겠습니까?')) return;
  localStorage.removeItem('golfBettingData');
  showSetupView();
}

// ─────────────────────────────────────────────
// BUILD UI (game view)
// ─────────────────────────────────────────────
function buildScoreboard() {
  const N = CONFIG.players.length;
  const grid = document.getElementById('scoreGrid');
  grid.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
  grid.innerHTML = CONFIG.players.map((name, i) => `
    <div class="score-card" id="sc-${i}">
      <div class="name">${escapeHtml(name)}</div>
      <div class="amount zero" id="sc-amt-${i}">₩0</div>
    </div>
  `).join('');
}

function buildHoles() {
  const N = CONFIG.players.length;
  const container = document.getElementById('holesContainer');
  container.innerHTML = '';
  for (let h = 0; h < HOLES; h++) {
    const half = h < 9 ? 'front' : 'back';
    const holeNum = h + 1;
    const d = gameData[h];

    const card = document.createElement('div');
    card.className = 'hole-card';
    card.id = `hole-card-${h}`;

    card.innerHTML = `
      <div class="hole-header" onclick="toggleHole(${h})">
        <div class="hole-title">
          <span class="hole-num-badge ${half}">${holeNum}</span>
          <span>${holeNum <= 9 ? '전반' : '후반'} ${holeNum <= 9 ? holeNum : holeNum - 9}홀</span>
          <div class="hole-badges" id="badges-${h}"></div>
        </div>
        <div class="hole-header-right">
          <div class="hole-mini-amounts" id="mini-${h}"></div>
          <span class="hole-toggle" id="toggle-${h}">▼</span>
        </div>
      </div>
      <div class="hole-body" id="body-${h}" style="display:${h===0?'block':'none'}">
        <div class="input-row" style="grid-template-columns: 60px repeat(${N}, 1fr)">
          <div class="input-col">
            <div class="input-label">파</div>
            <input class="score-input" id="par-${h}" type="number" min="3" max="5"
              value="${d.par}" onchange="setPar(${h},this.value)" style="font-size:16px;">
          </div>
          ${CONFIG.players.map((name, i) => `
            <div class="input-col">
              <div class="input-label">${escapeHtml(name)}</div>
              <input class="score-input" id="score-${h}-${i}" type="number" min="1" max="12"
                value="${d.scores[i] !== null ? d.scores[i] : ''}"
                placeholder="-"
                oninput="setScore(${h},${i},this.value)">
            </div>
          `).join('')}
        </div>
        <div id="hole-result-${h}"></div>
      </div>
    `;
    container.appendChild(card);
  }
}

// ─────────────────────────────────────────────
// EVENT HANDLERS
// ─────────────────────────────────────────────
function toggleHole(h) {
  const body = document.getElementById(`body-${h}`);
  const tog  = document.getElementById(`toggle-${h}`);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  tog.classList.toggle('open', !open);
}

function setPar(h, val) {
  const v = parseInt(val);
  if (isNaN(v) || v < 3 || v > 5) return;
  gameData[h].par = v;
  saveGameData();
  updateHole(h);
  updateAll();
}

function setScore(h, playerIdx, val) {
  const v = val === '' ? null : parseInt(val);
  gameData[h].scores[playerIdx] = (v !== null && isNaN(v)) ? null : v;
  saveGameData();
  updateHole(h);
  updateAll();
}

// ─────────────────────────────────────────────
// CALCULATION
// ─────────────────────────────────────────────
function yangpaThreshold(par) {
  const t = CONFIG.rules.yangpa.threshold || 'double_par';
  if (t === 'double_par')   return par * 2;
  if (t === 'double_bogey') return par + 2;
  return par + (CONFIG.rules.yangpa.customOffset || 3);
}

// Returns true if all players finished and all scored the same
function isAllTie(holeIdx) {
  const { scores } = gameData[holeIdx];
  if (scores.some(s => s === null)) return false;
  return scores.every(s => s === scores[0]);
}

// Count how many consecutive ties immediately before holeIdx
function getBaebanCount(holeIdx) {
  if (!CONFIG.rules.baeban || !CONFIG.rules.baeban.enabled) return 0;
  let count = 0;
  for (let h = holeIdx - 1; h >= 0; h--) {
    if (isAllTie(h)) count++;
    else break;
  }
  return count;
}

function calcHoleDelta(holeIdx) {
  const { par, scores } = gameData[holeIdx];
  const N = CONFIG.players.length;
  const delta = Array(N).fill(0);

  if (scores.some(s => s === null)) return delta;

  const isHoleinone = scores.map(s => s === 1);
  const isAlbatross = scores.map(s => s <= par - 3);
  const isEagle     = scores.map(s => s <= par - 2);
  const isBirdie    = scores.map(s => s <= par - 1);
  const isYangpa    = scores.map(s => s >= yangpaThreshold(par));

  const baebanCount = getBaebanCount(holeIdx);
  const maxMult     = (CONFIG.rules.baeban && CONFIG.rules.baeban.maxMult) || 3;
  const isBaeban    = baebanCount > 0;
  // 배판 base multiplier: 2 for first tie, keeps doubling but capped
  const baebanBase  = isBaeban ? Math.min(1 + baebanCount, maxMult) : 1;

  for (let a = 0; a < N; a++) {
    for (let b = a + 1; b < N; b++) {
      const diff = scores[a] - scores[b];
      if (diff === 0) continue;

      const winner = diff > 0 ? b : a;
      const loser  = diff > 0 ? a : b;
      const strokes = Math.abs(diff);

      let mult;
      const birdieMode = CONFIG.rules.birdie.mode || 'multiplier';

      if (isBaeban) {
        // ── 배판 모드: 배판 기본 배수에 버디/양파 조건을 덧셈으로 추가, 최대 maxMult ──
        let add = 0;
        // Winner: 가장 높은 보너스 하나만 적용 (홀인원>알바>이글>버디)
        if (CONFIG.rules.holeinone.enabled && isHoleinone[winner] && !isHoleinone[loser])
          add += CONFIG.rules.holeinone.mult - 1;
        else if (CONFIG.rules.albatross.enabled && isAlbatross[winner] && !isAlbatross[loser])
          add += CONFIG.rules.albatross.mult - 1;
        else if (CONFIG.rules.eagle.enabled && isEagle[winner] && !isEagle[loser])
          add += CONFIG.rules.eagle.mult - 1;
        else if (CONFIG.rules.birdie.enabled && birdieMode === 'multiplier' && isBirdie[winner] && !isBirdie[loser])
          add += CONFIG.rules.birdie.mult - 1;
        // Loser penalty 덧셈
        if (CONFIG.rules.yangpa.enabled && isYangpa[loser] && !isYangpa[winner])
          add += CONFIG.rules.yangpa.mult - 1;
        mult = Math.min(baebanBase + add, maxMult);
      } else {
        // ── 일반 모드: 기존 곱셈 방식 ──
        mult = 1;
        // Winner bonus: 홀인원 > 알바트로스 > 이글 > 버디(배수 방식만)
        if (CONFIG.rules.holeinone.enabled && isHoleinone[winner] && !isHoleinone[loser]) {
          mult *= CONFIG.rules.holeinone.mult;
        } else if (CONFIG.rules.albatross.enabled && isAlbatross[winner] && !isAlbatross[loser]) {
          mult *= CONFIG.rules.albatross.mult;
        } else if (CONFIG.rules.eagle.enabled && isEagle[winner] && !isEagle[loser]) {
          mult *= CONFIG.rules.eagle.mult;
        } else if (CONFIG.rules.birdie.enabled && birdieMode === 'multiplier' && isBirdie[winner] && !isBirdie[loser]) {
          mult *= CONFIG.rules.birdie.mult;
        }
        // Loser penalty
        if (CONFIG.rules.yangpa.enabled && isYangpa[loser] && !isYangpa[winner]) {
          mult *= CONFIG.rules.yangpa.mult;
        }
      } // end else (normal mode)

      const amount = strokes * CONFIG.unit * mult;
      delta[winner] += amount;
      delta[loser]  -= amount;
    }
  }

  // ── +1타 방식 버디 보너스: 버디 플레이어가 비버디 플레이어 각각에게 1타분 추가 수령 ──
  if (CONFIG.rules.birdie.enabled && (CONFIG.rules.birdie.mode || 'multiplier') === 'flat') {
    for (let i = 0; i < N; i++) {
      if (!isBirdie[i]) continue;
      for (let j = 0; j < N; j++) {
        if (i === j || isBirdie[j]) continue;
        delta[i] += CONFIG.unit;
        delta[j] -= CONFIG.unit;
      }
    }
  }

  return delta;
}

function calcTotals() {
  const N = CONFIG.players.length;
  const totals = Array(N).fill(0);
  for (let h = 0; h < HOLES; h++) {
    const d = calcHoleDelta(h);
    for (let i = 0; i < N; i++) totals[i] += d[i];
  }
  return totals;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function updateAll() {
  const N = CONFIG.players.length;
  const totals = calcTotals();

  for (let i = 0; i < N; i++) {
    const el = document.getElementById(`sc-amt-${i}`);
    if (!el) continue;
    el.textContent = formatWon(totals[i]);
    el.className = 'amount ' + signClass(totals[i]);
  }

  const filled = gameData.filter(h => h.scores.every(s => s !== null)).length;
  document.getElementById('progressFill').style.width = (filled / HOLES * 100) + '%';

  // 배판 배지가 변경될 수 있는 홀들의 배지 갱신 (다음 홀)
  // updateHole은 이미 현재 홀을 갱신하므로, 연쇄 배판 홀 배지만 별도 갱신
  for (let h = 0; h < HOLES; h++) {
    const baebanCount = getBaebanCount(h);
    const maxMult = (CONFIG.rules.baeban && CONFIG.rules.baeban.maxMult) || 3;
    const baebanMult = baebanCount > 0 ? Math.min(1 + baebanCount, maxMult) : 1;
    const badgesEl = document.getElementById(`badges-${h}`);
    if (!badgesEl) continue;
    // 배판 배지만 선택적으로 업데이트 (점수 배지는 updateHole이 담당)
    const existingBaeban = badgesEl.querySelector('.badge-baeban');
    if (baebanCount > 0 && !existingBaeban) {
      badgesEl.insertAdjacentHTML('afterbegin', `<span class="badge badge-baeban">🔁 ${baebanMult}배판</span>`);
    } else if (baebanCount > 0 && existingBaeban) {
      existingBaeban.textContent = `🔁 ${baebanMult}배판`;
    } else if (baebanCount === 0 && existingBaeban) {
      existingBaeban.remove();
    }
  }

  renderSettlement(totals);
}

function updateHole(h) {
  const N = CONFIG.players.length;
  const { par, scores } = gameData[h];
  const delta = calcHoleDelta(h);
  const isHoleinone = scores.map(s => s !== null && s === 1);
  const isAlbatross = scores.map(s => s !== null && s <= par - 3);
  const isEagle     = scores.map(s => s !== null && s <= par - 2);
  const isBirdie    = scores.map(s => s !== null && s <= par - 1);
  const isYangpa    = scores.map(s => s !== null && s >= yangpaThreshold(par));

  for (let i = 0; i < N; i++) {
    const inp = document.getElementById(`score-${h}-${i}`);
    if (!inp) continue;
    if (scores[i] === null) { inp.className = 'score-input'; continue; }
    if (isHoleinone[i])      inp.className = 'score-input holeinone';
    else if (isAlbatross[i]) inp.className = 'score-input albatross';
    else if (isEagle[i])     inp.className = 'score-input eagle';
    else if (isBirdie[i])    inp.className = 'score-input birdie';
    else if (isYangpa[i])    inp.className = 'score-input yangpa';
    else if (scores[i] === par) inp.className = 'score-input par';
    else inp.className = 'score-input';
  }

  // 배판 여부 계산
  const baebanCount = getBaebanCount(h);
  const maxMult     = (CONFIG.rules.baeban && CONFIG.rules.baeban.maxMult) || 3;
  const baebanMult  = baebanCount > 0 ? Math.min(1 + baebanCount, maxMult) : 1;

  const badgesEl = document.getElementById(`badges-${h}`);
  const anyScore = scores.some(s => s !== null);
  if (anyScore) {
    let html = '';
    // 배판 배지 (홀 헤더에 표시)
    if (baebanCount > 0) html += `<span class="badge badge-baeban">🔁 ${baebanMult}배판</span>`;
    if (isHoleinone.some(Boolean))      html += `<span class="badge badge-holeinone">홀인원⛳</span>`;
    else if (isAlbatross.some(Boolean)) html += `<span class="badge badge-albatross">알바트로스🦅🦅</span>`;
    else if (isEagle.some(Boolean))     html += `<span class="badge badge-eagle">이글🦅</span>`;
    else if (isBirdie.some(Boolean))    html += `<span class="badge badge-birdie">버디🐦</span>`;
    if (isYangpa.some(Boolean))         html += `<span class="badge badge-yangpa">양파🧅</span>`;
    badgesEl.innerHTML = html;
  } else {
    // 배판만 표시 (점수 미입력이어도 배판 배지는 보여야 함)
    badgesEl.innerHTML = baebanCount > 0
      ? `<span class="badge badge-baeban">🔁 ${baebanMult}배판</span>`
      : '';
  }

  const resultEl = document.getElementById(`hole-result-${h}`);
  if (!scores.every(s => s !== null)) {
    resultEl.innerHTML = '';
    clearMiniAmounts(h);
    return;
  }

  // 홀 정산에 배판 배수 표시
  const baebanLabel = baebanCount > 0
    ? `<div class="result-title" style="color:#ffb340">🔁 ${baebanMult}배판 적용</div>`
    : '';

  resultEl.innerHTML = `
    <div class="hole-result">
      <div class="result-title">홀 정산</div>
      ${baebanLabel}
      <div class="result-grid" style="grid-template-columns: repeat(${N}, 1fr)">
        ${CONFIG.players.map((name, i) => `
          <div class="result-cell ${delta[i] > 0 ? 'plus' : delta[i] < 0 ? 'minus' : ''}">
            <div class="r-name">${escapeHtml(name)}</div>
            <div class="r-amt ${signClass(delta[i])}">${formatWon(delta[i])}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  // Update mini amounts in hole header
  const miniEl = document.getElementById(`mini-${h}`);
  if (miniEl) {
    miniEl.innerHTML = CONFIG.players.map((name, i) =>
      `<span class="mini-amt ${signClass(delta[i])}" title="${escapeHtml(name)}">${formatWonShort(delta[i])}</span>`
    ).join('');
  }
}

// Clear mini amounts when not all scores are in (called from updateHole early return)
function clearMiniAmounts(h) {
  const miniEl = document.getElementById(`mini-${h}`);
  if (miniEl) miniEl.innerHTML = '';
}

function renderSettlement(totals) {
  const N = CONFIG.players.length;

  // Build rankings
  const ranked = CONFIG.players
    .map((name, i) => ({ name, total: totals[i], idx: i }))
    .sort((a, b) => b.total - a.total);
  const medals = ['🥇', '🥈', '🥉', '4위', '5위', '6위'];
  const hasAnyScore = totals.some(t => t !== 0);

  const rankHtml = ranked.map((p, rank) => {
    const cls = rank === 0 && p.total > 0 ? 'rank-1st'
              : rank === ranked.length - 1 && p.total < 0 ? 'rank-last' : '';
    return `
      <div class="rank-row ${cls}">
        <span class="rank-medal">${medals[rank] || (rank + 1) + '위'}</span>
        <span class="rank-name">${escapeHtml(p.name)}</span>
        <span class="rank-amt ${signClass(p.total)}">${formatWon(p.total)}</span>
      </div>`;
  }).join('');

  // Build transactions
  const bal = totals.slice();
  const transactions = [];
  for (let round = 0; round < 20; round++) {
    let maxIdx = 0, minIdx = 0;
    for (let i = 1; i < N; i++) {
      if (bal[i] > bal[maxIdx]) maxIdx = i;
      if (bal[i] < bal[minIdx]) minIdx = i;
    }
    if (Math.abs(bal[maxIdx]) < 1 || Math.abs(bal[minIdx]) < 1) break;
    const amt = Math.min(bal[maxIdx], -bal[minIdx]);
    if (amt < 1) break;
    transactions.push({ from: minIdx, to: maxIdx, amount: Math.round(amt) });
    bal[maxIdx] -= amt;
    bal[minIdx] += amt;
  }

  const body = document.getElementById('settlementBody');

  if (!hasAnyScore) {
    body.innerHTML = '<p class="no-settle">점수를 입력하면 정산이 계산됩니다.</p>';
    return;
  }

  const txHtml = transactions.length === 0
    ? '<p class="no-settle">모두 동점 — 정산 없음</p>'
    : transactions.map(t => `
        <div class="settle-row">
          <span class="settle-from">${escapeHtml(CONFIG.players[t.from])}</span>
          <span class="settle-arrow">→</span>
          <span class="settle-to">${escapeHtml(CONFIG.players[t.to])}</span>
          <span class="settle-amt">${t.amount.toLocaleString()}원</span>
        </div>`).join('');

  body.innerHTML = `
    <div class="rank-section">
      <div class="rank-section-title">순위</div>
      ${rankHtml}
    </div>
    <div class="settle-divider"></div>
    <div class="settle-subtitle">정산 내역</div>
    ${txHtml}
  `;
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function formatWon(v) {
  if (v === 0) return '₩0';
  return (v > 0 ? '+' : '-') + '₩' + Math.abs(v).toLocaleString();
}

function formatWonShort(v) {
  if (v === 0) return '±0';
  const sign = v > 0 ? '+' : '-';
  const abs = Math.abs(v);
  if (abs >= 10000) return sign + (abs / 1000).toFixed(0) + 'k';
  return sign + abs.toLocaleString();
}

function signClass(v) {
  return v > 0 ? 'plus' : v < 0 ? 'minus' : 'zero';
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
// STORAGE
// ─────────────────────────────────────────────
function saveConfig() {
  try { localStorage.setItem('golfBettingConfig', JSON.stringify(CONFIG)); } catch(e) {}
}

function loadConfig() {
  try {
    const s = localStorage.getItem('golfBettingConfig');
    if (!s) return null;
    const cfg = JSON.parse(s);
    if (!Array.isArray(cfg.players) || cfg.players.length < 2 || cfg.players.length > 6) return null;
    if (!cfg.unit || cfg.unit <= 0) return null;
    if (!cfg.rules) return null;
    // Backfill new rule fields for configs saved before this version
    const defaults = {
      albatross: { enabled: false, mult: 5 },
      holeinone: { enabled: false, mult: 5 },
      baeban:    { enabled: true,  maxMult: 3 },
    };
    Object.entries(defaults).forEach(([k, v]) => { if (!cfg.rules[k]) cfg.rules[k] = v; });
    if (!cfg.rules.birdie.mode) cfg.rules.birdie.mode = 'multiplier';
    if (!cfg.rules.yangpa.threshold) cfg.rules.yangpa.threshold = 'double_par';
    if (!cfg.rules.yangpa.customOffset) cfg.rules.yangpa.customOffset = 3;
    return cfg;
  } catch(e) { return null; }
}

function saveGameData() {
  try { localStorage.setItem('golfBettingData', JSON.stringify(gameData)); } catch(e) {}
}

function loadGameData() {
  try {
    const s = localStorage.getItem('golfBettingData');
    if (!s) return null;
    const data = JSON.parse(s);
    if (!Array.isArray(data) || data.length !== HOLES) return null;
    if (data.some(h => h.scores.length !== CONFIG.players.length)) return null;
    return data;
  } catch(e) { return null; }
}

function resetScores() {
  if (!confirm('점수를 초기화하시겠습니까?\n설정(인원/금액/조건)은 유지됩니다.')) return;
  gameData = freshGameData();
  saveGameData();
  buildHoles();
  updateAll();
  const tog = document.getElementById('toggle-0');
  if (tog) tog.classList.add('open');
}

// ─────────────────────────────────────────────
// SETUP UNIT BUTTON DATA ATTRIBUTES
// ─────────────────────────────────────────────
document.querySelectorAll('#unitBtns .pill-btn').forEach((btn, i) => {
  const vals = [1000, 2000, 5000, 'custom'];
  btn.dataset.unit = vals[i];
});

// ─────────────────────────────────────────────
// START
// ─────────────────────────────────────────────
init();
</script>
